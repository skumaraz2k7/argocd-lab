apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: platform-project
  namespace: argocd

spec:
  description: Cluster platform components managed by Argo CD

  sourceRepos:
    - https://github.com/skumaraz2k7/argocd-lab.git
    - https://blob.istio.io/istio-release/charts

  destinations:
    - namespace: istio-system
      server: "*"

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"