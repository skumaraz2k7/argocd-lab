apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: demo-project
  namespace: argocd

spec:
  description: Project for demo applications

  sourceRepos:
    - https://github.com/skumaraz2k7/argocd-lab.git

  destinations:
    - namespace: demo
      server: https://kubernetes.default.svc

    - namespace: demo
      server: https://host.docker.internal:6445

    - namespace: demo
      server: https://host.docker.internal:6446

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace