apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: demo-dev
  namespace: argocd

spec:
  project: demo-project

  source:
    repoURL: https://github.com/skumaraz2k7/argocd-lab.git
    targetRevision: main
    path: apps/demo-app

  destination:
    server: https://host.docker.internal:6445
    namespace: demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true