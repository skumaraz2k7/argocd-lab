apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: demo-local
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/skumaraz2k7/argocd-lab.git
    targetRevision: main
    path: apps/demo-app

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    syncOptions:
      - CreateNamespace=true