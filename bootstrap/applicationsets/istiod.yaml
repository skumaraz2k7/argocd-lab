apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: istiod
  namespace: argocd

spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            istio-enabled: "true"

  template:
    metadata:
      name: "istiod-{{name}}"

    spec:
      project: platform-project

      sources:
        - repoURL: https://blob.istio.io/istio-release/charts
          chart: istiod
          targetRevision: "1.31.0"

          helm:
            releaseName: istiod

            valueFiles:
              - $values/platform/istio/common/istiod-values.yaml
              - $values/platform/istio/clusters/{{metadata.labels.environment}}/istiod-values.yaml

        - repoURL: https://github.com/skumaraz2k7/argocd-lab.git
          targetRevision: main
          ref: values

      destination:
        server: "{{server}}"
        namespace: istio-system

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true